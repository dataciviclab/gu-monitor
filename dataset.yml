dataset:
  name: gu_acts
  display_name: Gazzetta Ufficiale — Atti pubblicati
  description: >
    Monitoraggio della Gazzetta Ufficiale della Repubblica Italiana:
    tutti gli atti pubblicati nelle 7 serie (Serie Generale, Corte Costituzionale,
    Unione Europea, Regioni, Concorsi, Contratti Pubblici, Parte II).
    Aggiornamento giornaliero via scraping archivio 30gg.
  source: Gazzetta Ufficiale — https://www.gazzettaufficiale.it
  source_url: https://www.gazzettaufficiale.it
  license: >
    Dati: Gazzetta Ufficiale della Repubblica Italiana (IPZS). La fonte dichiara
    che la riproduzione dei testi elettronici è consentita purché venga menzionata
    la fonte e il carattere non autentico e gratuito. Codice del repo: MIT.
  attribution: >
    Fonte: Gazzetta Ufficiale della Repubblica Italiana — www.gazzettaufficiale.it
  disclaimer: >
    I testi riprodotti non sono autentici: l'unico testo definitivo è quello
    pubblicato sulla Gazzetta Ufficiale a mezzo stampa, che prevale in caso di
    discordanza.

  coverage:
    period_start: null  # accumula dal primo run
    period_end: null    # vigente, si aggiorna
    territory: Italia
    granularity: atto

  schema:
    fields:
      - name: id
        type: string
        description: Codice redazionale dell'atto (es. 26G00165)
      - name: serie
        type: string
        description: Serie della GU (SG, S1, S2, S3, S4, S5, P2)
      - name: gazzetta_numero
        type: string
        description: Numero della pubblicazione
      - name: data_pubblicazione
        type: date
        description: Data di pubblicazione
      - name: titolo
        type: string
        description: Oggetto dell'atto (dal secondo anchor della pagina di dettaglio)
      - name: estremi
        type: string
        description: >
          Estremi dell'atto come pubblicati ("DECRETO 5 agosto 2026, n. 198";
          per le inserzioni P2 è il soggetto, es. la società)
      - name: tipo_atto
        type: string
        description: Tipo classificato (21 valori, da match a token intero sugli estremi)
      - name: ente
        type: string
        description: Ente emittente (da span.emettitore)
      - name: link
        type: string
        description: URL della pagina di dettaglio GU (parametri stabili per atto)
      - name: topic_str
        type: string
        description: Topic classificati (separati da virgola)
      - name: link_normattiva
        type: string
        description: Link a Normattiva (testo vigente)
      - name: urn_normattiva
        type: string
        description: URN NIR (identificativo permanente)

    key_fields: [id]

  tags:
    - gazzetta-ufficiale
    - normativa
    - legislazione
    - atti-pubblici
    - monitoraggio

datasets:
  - name: gu_acts
    display_name: Atti Gazzetta Ufficiale (30gg)
    path: data/gu_acts.parquet
    description: >
      Tutti gli atti pubblicati nella Gazzetta Ufficiale negli ultimi 30 giorni,
      con classificazione automatica per tipo, ente e topic.
    fields:
      - id: string
      - serie: string
      - gazzetta_numero: string
      - data_pubblicazione: date
      - titolo: string
      - estremi: string
      - tipo_atto: string
      - ente: string
      - link: string
      - topic_str: string
      - link_normattiva: string
      - urn_normattiva: string
