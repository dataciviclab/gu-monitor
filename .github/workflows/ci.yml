name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dataciviclab/.github/actions/python-setup@main

      - name: Install dev + dashboard dependencies
        run: pip install -e ".[dev,dashboard]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest tests/ dashboard/tests -v

  config-check:
    uses: dataciviclab/.github/.github/workflows/dataset-config-check-reusable.yml@main
    with:
      globs: "datasets"
