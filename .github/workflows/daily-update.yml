name: Daily Update

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: dataciviclab/.github/actions/python-setup@main

      - name: Scrape 30-day archive
        run: python scripts/scrape_30gg.py

      - name: Cross-reference Normattiva (URN)
        run: python scripts/crossref.py

      - name: Convert to Parquet
        run: python scripts/to_parquet.py

      - name: Run analytics
        run: python scripts/analytics.py

      - name: Alert alto impatto (ultime 24h)
        run: python scripts/alert_high_impact.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%Y-%m-%d)"
          git push
