name: Daily Update

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install duckdb requests

      - name: Scrape 30-day archive
        run: python scripts/scrape_30gg.py

      - name: Convert to Parquet
        run: python scripts/to_parquet.py

      - name: Run analytics
        run: python scripts/analytics.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%Y-%m-%d)"
          git push
