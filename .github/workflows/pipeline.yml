name: Pipeline

# Raw -> clean -> mart -> GCS -> registry (PR draft).
# Il build gira di norma dentro daily-update.yml, dopo la cattura. Questo
# workflow serve per ricostruire a mano o quando cambia il codice della pipeline.
# Non fa rete: il raw è l'event log su GCS.

on:
  push:
    branches: [main]
    paths:
      - "datasets/**"
      - "sql/**"
  workflow_dispatch:

concurrency:
  group: gu-monitor-store  # stesso oggetto GCS di daily e rebuild
  cancel-in-progress: false

jobs:
  pipeline:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "gu-monitor"
      run-command: "make run"
      pre-run-command: "make store-pull"
      detect-paths: ""
      install-extras: "dev,pipeline"
      sync-pattern: "per-dataset"
      verify-command: "python scripts/verify_clean.py"
    secrets: inherit
