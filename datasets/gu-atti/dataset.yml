root: ../../out
schema_version: 1

dataset:
  name: gu_atti
  source_id: gazzetta_ufficiale
  tags: [diritto, normativa, gazzetta-ufficiale, atti-pubblici, monitoraggio]
  category: normativa
  license: >
    Dati: Gazzetta Ufficiale della Repubblica Italiana (IPZS). Riproduzione
    consentita con menzione della fonte e carattere non autentico/gratuito.
    Codice del repo: MIT.
  attribution: "Fonte: Gazzetta Ufficiale della Repubblica Italiana — www.gazzettaufficiale.it"
  disclaimer: >
    I testi riprodotti non sono autentici: l'unico testo definitivo è quello
    pubblicato sulla Gazzetta Ufficiale a mezzo stampa, che prevale in caso di
    discordanza.
  description: >
    Atti pubblicati sulla Gazzetta Ufficiale della Repubblica Italiana, nelle 7
    serie (Serie Generale, Corte Costituzionale, Unione Europea, Regioni,
    Concorsi, Contratti Pubblici, Parte II). Un record per atto, con estremi,
    oggetto, ente emittente e URN NIR quando l'atto è normativo.
  # Un anno per partizione pubblicata. Il backfill di 2024-2025 è già nello
  # store su GCS (rebuild.yml, 31/10 e 18/11): qui si dichiara solo cosa
  # pubblicare.
  years:
    - 2024
    - 2025
    - 2026
  time_coverage:
    start_year: 2024
    end_year: 2026

# Il raw è l'event log catturato da capture.py e tenuto in data/gu_acts.parquet.
# Il toolkit non fa rete: la cattura è uno step separato (`make ingest`), così
# un guasto della fonte non si confonde con un errore di build.
raw:
  output_policy: overwrite
  sources:
    - name: event_log
      type: local_file
      args:
        path: ../../data/gu_acts.parquet
        filename: gu_atti.parquet
      primary: true

clean:
  read:
    source: auto
    mode: all
  required_columns:
    - id
    - serie
    - data_pubblicazione
    - titolo
    - tipo_atto
  sql: sql/clean.sql
  validate:
    # La chiave naturale è `(id, serie)`: il codice redazionale da solo non è
    # unico. Misurato sullo store (98.764 atti, 2024-2026): 3 collisioni, tutte
    # fra serie diverse — `24A00906` e `24E04094` (S4 vs SG), `25A00676` (SG vs
    # S4). Sono atti distinti: deduplicare perderebbe un atto vero.
    primary_key:
      - id
      - serie
    not_null:
      - id
      - serie
      - gazzetta_numero
      - data_pubblicazione
      - titolo
      - tipo_atto
    ranges:
      anno:
        min: 1861
        max: 2100
    # Floor basso di proposito: qui basta impedire un clean vuoto. La soglia
    # vera sta in `scripts/verify_clean.py`, che la applica per anno (1000 per
    # un anno chiuso, non-vuoto per l'anno aperto) e gira prima del sync.
    # Con 1000 qui, il 1° gennaio il build fallirebbe per ~10 giorni, e con
    # lui la pubblicazione anche degli anni chiusi.
    min_rows: 1

mart:
  tables:
    - name: mart_atti_per_serie_giorno
      sql: sql/mart_serie_giorno.sql
    - name: mart_atti_per_tipo
      sql: sql/mart_tipo.sql
    - name: mart_normativi_urn
      sql: sql/mart_normativi_urn.sql
  required_tables:
    - mart_atti_per_serie_giorno
    - mart_atti_per_tipo
    - mart_normativi_urn
  validate:
    # I floor di riga non possono stare qui: qui girano per **ogni** partizione,
    # e una partizione di gennaio (due giorni, poche decine di atti) non
    # raggiunge nessuna soglia annuale — nemmeno `mart_normativi_urn`, che nei
    # primi giorni può essere legittimamente vuota. Le soglie per anno stanno
    # in `scripts/verify_clean.py`, che le applica solo agli anni chiusi.
    table_rules:
      mart_atti_per_serie_giorno:
        required_columns: [serie, data_pubblicazione, atti]
      mart_atti_per_tipo:
        required_columns: [tipo_atto, atti]
      mart_normativi_urn:
        required_columns: [id, urn_normattiva]
